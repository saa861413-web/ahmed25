<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة درجات الطلاب</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: "Tahoma", "Arial", sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            opacity: 0.9;
        }

        .container {
            width: 95%;
            max-width: 1250px;
            margin: 30px auto;
        }

        /* الإحصائيات */

        .stats {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(200px, 1fr)
            );

            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .stat h3 {
            margin: 0;
            color: #64748b;
        }

        .stat p {
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
            margin: 12px 0 0;
        }

        /* البطاقات */

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        /* النموذج */

        .form {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #1e3a8a;
        }

        /* الأزرار */

        button {
            border: none;

            padding:
                12px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            background: #1e3a8a;

            color: white;
        }

        button:hover {
            background: #162d6b;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }

        /* الجدول */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;

            min-width: 900px;
        }

        th,
        td {
            padding: 13px;

            text-align: center;

            border-bottom:
                1px solid #e5e7eb;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* التقديرات */

        .grade-A {
            color: #16a34a;
            font-weight: bold;
        }

        .grade-B {
            color: #2563eb;
            font-weight: bold;
        }

        .grade-C {
            color: #ca8a04;
            font-weight: bold;
        }

        .grade-D {
            color: #ea580c;
            font-weight: bold;
        }

        .grade-F {
            color: #dc2626;
            font-weight: bold;
        }

        /* الهاتف */

        @media (max-width: 700px) {

            header h1 {
                font-size: 22px;
            }

            .container {
                width: 92%;
            }

            .card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<!-- رأس الموقع -->

<header>

    <h1>
        نظام إدارة درجات الطلاب
    </h1>

    <p>
        إدارة الطلاب والدرجات بطريقة سهلة وسريعة
    </p>

</header>



<div class="container">


    <!-- الإحصائيات -->

    <div class="stats">


        <div class="stat">

            <h3>
                إجمالي الطلاب
            </h3>

            <p id="studentCount">
                0
            </p>

        </div>



        <div class="stat">

            <h3>
                أعلى نسبة
            </h3>

            <p id="highestGrade">
                0%
            </p>

        </div>



        <div class="stat">

            <h3>
                متوسط الدرجات
            </h3>

            <p id="averageGrade">
                0%
            </p>

        </div>


    </div>



    <!-- إضافة طالب -->

    <div class="card">

        <h2>
            إضافة طالب جديد
        </h2>


        <div class="form">


            <input
                type="text"
                id="studentName"
                placeholder="اسم الطالب"
            >


            <input
                type="text"
                id="studentClass"
                placeholder="الفصل"
            >


            <input
                type="number"
                id="arabic"
                placeholder="اللغة العربية / 100"
                min="0"
                max="100"
            >


            <input
                type="number"
                id="english"
                placeholder="اللغة الإنجليزية / 100"
                min="0"
                max="100"
            >


            <input
                type="number"
                id="math"
                placeholder="الرياضيات / 100"
                min="0"
                max="100"
            >


            <input
                type="number"
                id="science"
                placeholder="العلوم / 100"
                min="0"
                max="100"
            >


        </div>


        <br>


        <button onclick="addStudent()">

            إضافة الطالب

        </button>


    </div>



    <!-- جدول الطلاب -->

    <div class="card">


        <h2>
            سجل درجات الطلاب
        </h2>


        <div class="table-container">


            <table>


                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            اسم الطالب
                        </th>

                        <th>
                            الفصل
                        </th>

                        <th>
                            العربي
                        </th>

                        <th>
                            الإنجليزي
                        </th>

                        <th>
                            الرياضيات
                        </th>

                        <th>
                            العلوم
                        </th>

                        <th>
                            المجموع
                        </th>

                        <th>
                            النسبة
                        </th>

                        <th>
                            التقدير
                        </th>

                        <th>
                            إجراء
                        </th>

                    </tr>

                </thead>


                <tbody id="studentsTable">

                </tbody>


            </table>


        </div>


    </div>


</div>



<script>


/* تحميل البيانات */

let students =
    JSON.parse(
        localStorage.getItem("students")
    ) || [];



/* إضافة طالب */

function addStudent() {


    const name =
        document
        .getElementById("studentName")
        .value
        .trim();


    const studentClass =
        document
        .getElementById("studentClass")
        .value
        .trim();


    const arabic =
        Number(
            document
            .getElementById("arabic")
            .value
        );


    const english =
        Number(
            document
            .getElementById("english")
            .value
        );


    const math =
        Number(
            document
            .getElementById("math")
            .value
        );


    const science =
        Number(
            document
            .getElementById("science")
            .value
        );



    /* التحقق من البيانات */

    if (!name || !studentClass) {

        alert(
            "من فضلك أدخل اسم الطالب والفصل."
        );

        return;

    }



    /* حساب المجموع */

    const total =
        arabic +
        english +
        math +
        science;



    /* حساب النسبة */

    const percentage =
        total / 4;



    /* حساب التقدير */

    const grade =
        getGrade(percentage);



    const student = {

        name: name,

        className: studentClass,

        arabic: arabic,

        english: english,

        math: math,

        science: science,

        total: total,

        percentage: percentage,

        grade: grade

    };



    students.push(student);



    saveData();

    displayStudents();

    clearInputs();


    alert(
        "تمت إضافة الطالب بنجاح."
    );

}



/* حساب التقدير */

function getGrade(percentage) {


    if (percentage >= 90)
        return "ممتاز";


    if (percentage >= 80)
        return "جيد جداً";


    if (percentage >= 70)
        return "جيد";


    if (percentage >= 60)
        return "مقبول";


    return "راسب";

}



/* عرض الطلاب */

function displayStudents() {


    const table =
        document
        .getElementById(
            "studentsTable"
        );


    table.innerHTML = "";



    students.forEach(
        (student, index) => {


            let gradeClass = "";


            if (student.grade === "ممتاز")
                gradeClass = "grade-A";


            else if (
                student.grade === "جيد جداً"
            )
                gradeClass = "grade-B";


            else if (
                student.grade === "جيد"
            )
                gradeClass = "grade-C";


            else if (
                student.grade === "مقبول"
            )
                gradeClass = "grade-D";


            else
                gradeClass = "grade-F";



            const row =
                document.createElement("tr");



            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${student.name}
                </td>

                <td>
                    ${student.className}
                </td>

                <td>
                    ${student.arabic}
                </td>

                <td>
                    ${student.english}
                </td>

                <td>
                    ${student.math}
                </td>

                <td>
                    ${student.science}
                </td>

                <td>
                    ${student.total} / 400
                </td>

                <td>
                    ${student.percentage.toFixed(1)}%
                </td>

                <td class="${gradeClass}">
                    ${student.grade}
                </td>

                <td>

                    <button
                        class="delete"
                        onclick="deleteStudent(${index})"
                    >

                        حذف

                    </button>

                </td>

            `;


            table.appendChild(row);

        }
    );



    updateStatistics();

}



/* حذف طالب */

function deleteStudent(index) {


    const confirmDelete =
        confirm(
            "هل أنت متأكد من حذف هذا الطالب؟"
        );


    if (confirmDelete) {

        students.splice(index, 1);

        saveData();

        displayStudents();

    }

}



/* تحديث الإحصائيات */

function updateStatistics() {


    document
    .getElementById(
        "studentCount"
    )
    .textContent =
        students.length;



    if (students.length === 0) {

        document
        .getElementById(
            "highestGrade"
        )
        .textContent = "0%";


        document
        .getElementById(
            "averageGrade"
        )
        .textContent = "0%";


        return;

    }



    const percentages =
        students.map(
            student =>
                student.percentage
        );



    const highest =
        Math.max(
            ...percentages
        );



    const average =
        percentages.reduce(
            (a, b) => a + b,
            0
        ) / percentages.length;



    document
    .getElementById(
        "highestGrade"
    )
    .textContent =
        highest.toFixed(1) + "%";



    document
    .getElementById(
        "averageGrade"
    )
    .textContent =
        average.toFixed(1) + "%";

}



/* حفظ البيانات */

function saveData() {


    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

}



/* تنظيف الخانات */

function clearInputs() {


    document
    .getElementById("studentName")
    .value = "";


    document
    .getElementById("studentClass")
    .value = "";


    document
    .getElementById("arabic")
    .value = "";


    document
    .getElementById("english")
    .value = "";


    document
    .getElementById("math")
    .value = "";


    document
    .getElementById("science")
    .value = "";

}



/* تشغيل الموقع */

displayStudents();


</script>


</body>

</html>
