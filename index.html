<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة درجات الطلاب</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        /* الإحصائيات */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .stat h3 {
            margin: 0;
            color: #64748b;
        }

        .stat p {
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
            margin: 12px 0 0;
        }

        /* البطاقات */

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        /* النماذج */

        .form {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;
            outline: none;

            background: white;
        }

        input:focus,
        select:focus {
            border-color: #1e3a8a;
        }

        /* الأزرار */

        button {
            border: none;

            padding: 12px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            background: #1e3a8a;
            color: white;
        }

        button:hover {
            background: #162d6b;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .edit {
            background: #d97706;
        }

        .edit:hover {
            background: #b45309;
        }

        /* الجدول */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;

            margin-top: 15px;

            min-width: 1100px;
        }

        th,
        td {
            padding: 13px;
            text-align: center;

            border-bottom:
                1px solid #e5e7eb;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* قائمة المدرسين */

        .teacher-list {
            margin-top: 20px;
        }

        .teacher-item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #f8fafc;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 8px;
        }

        .teacher-name {
            font-weight: bold;
            color: #1e3a8a;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        /* الهاتف */

        @media (max-width: 700px) {

            .container {
                width: 92%;
            }

            header h1 {
                font-size: 22px;
            }

            .card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        نظام إدارة درجات الطلاب
    </h1>

    <p>
        إدارة الطلاب والمدرسين والدرجات
    </p>

</header>



<div class="container">


    <!-- الإحصائيات -->

    <div class="stats">


        <div class="stat">

            <h3>
                إجمالي الطلاب
            </h3>

            <p id="studentCount">
                0
            </p>

        </div>


        <div class="stat">

            <h3>
                إجمالي المدرسين
            </h3>

            <p id="teacherCount">
                0
            </p>

        </div>


        <div class="stat">

            <h3>
                أعلى نسبة
            </h3>

            <p id="highestGrade">
                0%
            </p>

        </div>


        <div class="stat">

            <h3>
                متوسط الدرجات
            </h3>

            <p id="averageGrade">
                0%
            </p>

        </div>


    </div>



    <!-- إدارة المدرسين -->

    <div class="card">

        <h2>
            إدارة المدرسين
        </h2>


        <div class="form">

            <input
                type="text"
                id="teacherName"
                placeholder="اكتب اسم المدرس"
            >

            <button onclick="addTeacher()">
                إضافة مدرس
            </button>

        </div>


        <div
            class="teacher-list"
            id="teacherList"
        >

        </div>

    </div>



    <!-- إضافة طالب -->

    <div class="card">

        <h2>
            إضافة طالب جديد
        </h2>


        <div class="form">


            <input
                type="text"
                id="studentName"
                placeholder="اسم الطالب"
            >


            <input
                type="text"
                id="studentClass"
                placeholder="الفصل"
            >


            <select id="teacher">

                <option value="">
                    اختر المدرس
                </option>

            </select>


            <input
                type="number"
                id="written"
                placeholder="درجة التحريري / 100"
                min="0"
                max="100"
            >


            <input
                type="number"
                id="recitation"
                placeholder="درجة السرد / 100"
                min="0"
                max="100"
            >


            <input
                type="number"
                id="oral"
                placeholder="درجة الشفوي / 100"
                min="0"
                max="100"
            >


            <input
                type="number"
                id="homework"
                placeholder="درجة الواجب / 100"
                min="0"
                max="100"
            >


        </div>


        <br>


        <button onclick="addStudent()">

            إضافة الطالب

        </button>


    </div>



    <!-- جدول الطلاب -->

    <div class="card">

        <h2>
            سجل درجات الطلاب
        </h2>


        <div class="table-container">

            <table>


                <thead>

                    <tr>

                        <th>#</th>

                        <th>
                            اسم الطالب
                        </th>

                        <th>
                            الفصل
                        </th>

                        <th>
                            المدرس
                        </th>

                        <th>
                            التحريري
                        </th>

                        <th>
                            السرد
                        </th>

                        <th>
                            الشفوي
                        </th>

                        <th>
                            الواجب
                        </th>

                        <th>
                            المجموع
                        </th>

                        <th>
                            النسبة
                        </th>

                        <th>
                            التقدير
                        </th>

                        <th>
                            الإجراء
                        </th>

                    </tr>

                </thead>


                <tbody id="studentsTable">

                </tbody>


            </table>

        </div>

    </div>


</div>



<script>


    /* =========================
       البيانات
    ========================= */


    let teachers =
        JSON.parse(
            localStorage.getItem("teachers")
        ) || [];


    let students =
        JSON.parse(
            localStorage.getItem("students")
        ) || [];



    /* =========================
       إضافة مدرس
    ========================= */


    function addTeacher() {


        const input =
            document.getElementById(
                "teacherName"
            );


        const name =
            input.value.trim();


        if (!name) {

            alert(
                "من فضلك اكتب اسم المدرس."
            );

            return;
        }


        if (teachers.includes(name)) {

            alert(
                "هذا المدرس موجود بالفعل."
            );

            return;
        }


        teachers.push(name);


        saveTeachers();


        input.value = "";


        displayTeachers();


        updateTeacherSelect();

    }



    /* =========================
       عرض المدرسين
    ========================= */


    function displayTeachers() {


        const list =
            document.getElementById(
                "teacherList"
            );


        list.innerHTML = "";


        if (teachers.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    لا يوجد مدرسون مضافون حتى الآن.
                </div>
            `;

            return;
        }


        teachers.forEach(
            (teacher, index) => {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "teacher-item";


                item.innerHTML = `

                    <span class="teacher-name">
                        ${teacher}
                    </span>

                    <button
                        class="delete"
                        onclick="
                            deleteTeacher(${index})
                        "
                    >
                        حذف
                    </button>

                `;


                list.appendChild(item);

            }
        );

    }



    /* =========================
       حذف مدرس
    ========================= */


    function deleteTeacher(index) {


        const teacher =
            teachers[index];


        const used =
            students.some(
                student =>
                    student.teacher === teacher
            );


        if (used) {

            alert(
                "لا يمكن حذف هذا المدرس لأنه مرتبط بطلاب."
            );

            return;
        }


        if (
            confirm(
                "هل أنت متأكد من حذف المدرس؟"
            )
        ) {

            teachers.splice(index, 1);


            saveTeachers();


            displayTeachers();


            updateTeacherSelect();

        }

    }



    /* =========================
       تحديث قائمة المدرسين
    ========================= */


    function updateTeacherSelect() {


        const select =
            document.getElementById(
                "teacher"
            );


        select.innerHTML = `

            <option value="">
                اختر المدرس
            </option>

        `;


        teachers.forEach(
            teacher => {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    teacher;


                option.textContent =
                    teacher;


                select.appendChild(option);

            }
        );

    }



    /* =========================
       إضافة طالب
    ========================= */


    function addStudent() {


        const name =
            document
            .getElementById("studentName")
            .value
            .trim();


        const studentClass =
            document
            .getElementById("studentClass")
            .value
            .trim();


        const teacher =
            document
            .getElementById("teacher")
            .value;


        const written =
            Number(
                document
                .getElementById("written")
                .value
            );


        const recitation =
            Number(
                document
                .getElementById("recitation")
                .value
            );


        const oral =
            Number(
                document
                .getElementById("oral")
                .value
            );


        const homework =
            Number(
                document
                .getElementById("homework")
                .value
            );



        /* التحقق من البيانات */


        if (!name) {

            alert(
                "من فضلك أدخل اسم الطالب."
            );

            return;
        }


        if (!studentClass) {

            alert(
                "من فضلك أدخل الفصل."
            );

            return;
        }


        if (!teacher) {

            alert(
                "من فضلك اختر المدرس."
            );

            return;
        }


        if (
            written < 0 ||
            written > 100 ||
            recitation < 0 ||
            recitation > 100 ||
            oral < 0 ||
            oral > 100 ||
            homework < 0 ||
            homework > 100
        ) {

            alert(
                "يجب أن تكون كل درجة بين 0 و100."
            );

            return;
        }



        /* حساب المجموع */


        const total =
            written +
            recitation +
            oral +
            homework;



        /* حساب النسبة */


        const percentage =
            total / 4;



        /* التقدير */


        const grade =
            getGrade(percentage);



        /* بيانات الطالب */


        const student = {

            name: name,

            className: studentClass,

            teacher: teacher,

            written: written,

            recitation: recitation,

            oral: oral,

            homework: homework,

            total: total,

            percentage: percentage,

            grade: grade

        };



        students.push(student);


        saveStudents();


        displayStudents();


        clearStudentInputs();

    }



    /* =========================
       التقدير
    ========================= */


    function getGrade(percentage) {


        if (percentage >= 90) {

            return "ممتاز";

        }


        if (percentage >= 80) {

            return "جيد جدًا";

        }


        if (percentage >= 70) {

            return "جيد";

        }


        if (percentage >= 60) {

            return "مقبول";

        }


        return "راسب";

    }



    /* =========================
       عرض الطلاب
    ========================= */


    function displayStudents() {


        const table =
            document.getElementById(
                "studentsTable"
            );


        table.innerHTML = "";


        if (students.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="12"
                        class="empty"
                    >

                        لا يوجد طلاب مضافون حتى الآن.

                    </td>

                </tr>

            `;

        }


        students.forEach(
            (student, index) => {


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${student.name}
                    </td>

                    <td>
                        ${student.className}
                    </td>

                    <td>
                        ${student.teacher}
                    </td>

                    <td>
                        ${student.written}
                    </td>

                    <td>
                        ${student.recitation}
                    </td>

                    <td>
                        ${student.oral}
                    </td>

                    <td>
                        ${student.homework}
                    </td>

                    <td>
                        ${student.total} / 400
                    </td>

                    <td>
                        ${student.percentage.toFixed(1)}%
                    </td>

                    <td>
                        ${student.grade}
                    </td>

                    <td>

                        <button
                            class="delete"
                            onclick="
                                deleteStudent(${index})
                            "
                        >

                            حذف

                        </button>

                    </td>

                `;


                table.appendChild(row);

            }
        );


        updateStatistics();

    }



    /* =========================
       حذف طالب
    ========================= */


    function deleteStudent(index) {


        if (
            confirm(
                "هل أنت متأكد من حذف هذا الطالب؟"
            )
        ) {


            students.splice(index, 1);


            saveStudents();


            displayStudents();

        }

    }



    /* =========================
       الإحصائيات
    ========================= */


    function updateStatistics() {


        document
            .getElementById(
                "studentCount"
            )
            .textContent =
            students.length;


        document
            .getElementById(
                "teacherCount"
            )
            .textContent =
            teachers.length;



        if (students.length === 0) {


            document
                .getElementById(
                    "highestGrade"
                )
                .textContent =
                "0%";


            document
                .getElementById(
                    "averageGrade"
                )
                .textContent =
                "0%";


            return;

        }



        const percentages =
            students.map(
                student =>
                    student.percentage
            );



        const highest =
            Math.max(
                ...percentages
            );



        const average =
            percentages.reduce(
                (a, b) => a + b,
                0
            ) / percentages.length;



        document
            .getElementById(
                "highestGrade"
            )
            .textContent =
            highest.toFixed(1) + "%";



        document
            .getElementById(
                "averageGrade"
            )
            .textContent =
            average.toFixed(1) + "%";

    }



    /* =========================
       حفظ المدرسين
    ========================= */


    function saveTeachers() {


        localStorage.setItem(
            "teachers",
            JSON.stringify(teachers)
        );

    }



    /* =========================
       حفظ الطلاب
    ========================= */


    function saveStudents() {


        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

    }



    /* =========================
       تنظيف نموذج الطالب
    ========================= */


    function clearStudentInputs() {


        document
            .getElementById("studentName")
            .value = "";


        document
            .getElementById("studentClass")
            .value = "";


        document
            .getElementById("teacher")
            .value = "";


        document
            .getElementById("written")
            .value = "";


        document
            .getElementById("recitation")
            .value = "";


        document
            .getElementById("oral")
            .value = "";


        document
            .getElementById("homework")
            .value = "";

    }



    /* =========================
       تشغيل الموقع
    ========================= */


    displayTeachers();

    updateTeacherSelect();

    displayStudents();

    updateStatistics();


</script>


</body>

</html>
