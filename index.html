<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grades System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            background: #1e3a8a;
            color: white;
        }

        button:hover {
            background: #162d6b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat h3 {
            margin: 0;
            color: #64748b;
        }

        .stat p {
            font-size: 28px;
            font-weight: bold;
            color: #1e3a8a;
            margin: 10px 0 0;
        }

        @media (max-width: 700px) {
            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Grades Management System</h1>
    <p>Manage students and their grades easily</p>
</header>

<div class="container">

    <!-- Statistics -->

    <div class="stats">

        <div class="stat">
            <h3>Total Students</h3>
            <p id="studentCount">0</p>
        </div>

        <div class="stat">
            <h3>Highest Grade</h3>
            <p id="highestGrade">0%</p>
        </div>

        <div class="stat">
            <h3>Average</h3>
            <p id="averageGrade">0%</p>
        </div>

    </div>

    <br>

    <!-- Add Student -->

    <div class="card">

        <h2>Add Student</h2>

        <div class="form">

            <input
                type="text"
                id="studentName"
                placeholder="Student name"
            >

            <input
                type="text"
                id="studentClass"
                placeholder="Class"
            >

            <input
                type="number"
                id="arabic"
                placeholder="Arabic / 100"
                min="0"
                max="100"
            >

            <input
                type="number"
                id="english"
                placeholder="English / 100"
                min="0"
                max="100"
            >

            <input
                type="number"
                id="math"
                placeholder="Math / 100"
                min="0"
                max="100"
            >

            <input
                type="number"
                id="science"
                placeholder="Science / 100"
                min="0"
                max="100"
            >

        </div>

        <br>

        <button onclick="addStudent()">
            Add Student
        </button>

    </div>


    <!-- Students Table -->

    <div class="card">

        <h2>Students Grades</h2>

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Arabic</th>
                    <th>English</th>
                    <th>Math</th>
                    <th>Science</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="studentsTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    let students = JSON.parse(
        localStorage.getItem("students")
    ) || [];


    function addStudent() {

        const name =
            document.getElementById("studentName").value.trim();

        const studentClass =
            document.getElementById("studentClass").value.trim();

        const arabic =
            Number(document.getElementById("arabic").value);

        const english =
            Number(document.getElementById("english").value);

        const math =
            Number(document.getElementById("math").value);

        const science =
            Number(document.getElementById("science").value);


        if (!name || !studentClass) {

            alert("Please enter the student name and class.");

            return;
        }


        const total =
            arabic +
            english +
            math +
            science;


        const percentage =
            total / 4;


        const grade =
            getGrade(percentage);


        const student = {

            name: name,

            className: studentClass,

            arabic: arabic,

            english: english,

            math: math,

            science: science,

            total: total,

            percentage: percentage,

            grade: grade

        };


        students.push(student);


        saveData();

        displayStudents();

        clearInputs();

    }


    function getGrade(percentage) {

        if (percentage >= 90)
            return "A";

        if (percentage >= 80)
            return "B";

        if (percentage >= 70)
            return "C";

        if (percentage >= 60)
            return "D";

        return "F";
    }


    function displayStudents() {

        const table =
            document.getElementById("studentsTable");


        table.innerHTML = "";


        students.forEach((student, index) => {

            const row = document.createElement("tr");


            row.innerHTML = `

                <td>${index + 1}</td>

                <td>${student.name}</td>

                <td>${student.className}</td>

                <td>${student.arabic}</td>

                <td>${student.english}</td>

                <td>${student.math}</td>

                <td>${student.science}</td>

                <td>${student.total}/400</td>

                <td>${student.percentage.toFixed(1)}%</td>

                <td>${student.grade}</td>

                <td>

                    <button
                        class="delete"
                        onclick="deleteStudent(${index})"
                    >
                        Delete
                    </button>

                </td>

            `;


            table.appendChild(row);

        });


        updateStatistics();

    }


    function deleteStudent(index) {

        if (
            confirm(
                "Are you sure you want to delete this student?"
            )
        ) {

            students.splice(index, 1);

            saveData();

            displayStudents();

        }

    }


    function updateStatistics() {

        document.getElementById("studentCount")
            .textContent = students.length;


        if (students.length === 0) {

            document.getElementById("highestGrade")
                .textContent = "0%";

            document.getElementById("averageGrade")
                .textContent = "0%";

            return;
        }


        const percentages =
            students.map(
                student => student.percentage
            );


        const highest =
            Math.max(...percentages);


        const average =
            percentages.reduce(
                (a, b) => a + b,
                0
            ) / percentages.length;


        document.getElementById("highestGrade")
            .textContent =
            highest.toFixed(1) + "%";


        document.getElementById("averageGrade")
            .textContent =
            average.toFixed(1) + "%";

    }


    function saveData() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

    }


    function clearInputs() {

        document.getElementById("studentName").value = "";

        document.getElementById("studentClass").value = "";

        document.getElementById("arabic").value = "";

        document.getElementById("english").value = "";

        document.getElementById("math").value = "";

        document.getElementById("science").value = "";

    }


    displayStudents();

</script>

</body>
</html>
